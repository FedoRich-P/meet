# Render Blueprint: one URL for UI + Socket.IO + API (like Dion / Telemost link)
# Dashboard: New → Blueprint → connect repo with this file
services:
  - type: web
    name: meet
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --prefix client && npm run build --prefix client && NPM_CONFIG_PRODUCTION=false npm ci --prefix server && npm run build --prefix server
    startCommand: NODE_ENV=production npm start --prefix server
    envVars:
      - key: PUBLIC_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
